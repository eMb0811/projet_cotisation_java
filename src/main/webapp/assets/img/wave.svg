<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Fond officiel Wave Cyan -->
  <rect width="120" height="120" rx="24" fill="#1DC3EC"/>
  
  <!-- Mascotte Wave : Petit pingouin stylisé officiel -->
  <!-- Corps -->
  <ellipse cx="60" cy="58" rx="26" ry="32" fill="#0E1E2E"/>
  <!-- Ventre blanc -->
  <ellipse cx="60" cy="62" rx="17" ry="24" fill="#FFFFFF"/>
  <!-- Yeux blancs avec pupille -->
  <circle cx="52" cy="44" r="4.5" fill="#FFFFFF"/>
  <circle cx="68" cy="44" r="4.5" fill="#FFFFFF"/>
  <circle cx="53" cy="44" r="2.5" fill="#0E1E2E"/>
  <circle cx="67" cy="44" r="2.5" fill="#0E1E2E"/>
  <!-- Bec orange vif -->
  <polygon points="60,48 53,53 67,53" fill="#FF9400"/>
  <!-- Petites ailes -->
  <ellipse cx="36" cy="60" rx="4" ry="12" fill="#0E1E2E" transform="rotate(18 36 60)"/>
  <ellipse cx="84" cy="60" rx="4" ry="12" fill="#0E1E2E" transform="rotate(-18 84 60)"/>
  <!-- Pieds palmés orange -->
  <ellipse cx="51" cy="90" rx="8" ry="4" fill="#FF9400"/>
  <ellipse cx="69" cy="90" rx="8" ry="4" fill="#FF9400"/>

  <!-- Logo Wave lettrage blanc -->
  <text x="60" y="108" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="12" fill="#0E1E2E" text-anchor="middle" letter-spacing="1.5">wave</text>
</svg>
