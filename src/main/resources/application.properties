# =====================================================================
# SYSTEME DE GESTION DES COTISATIONS UCAD
# Fichier de Configuration Centralisé (application.properties)
# =====================================================================

# ---------------------------------------------------------------------
# 1. POINT DE CONFIGURATION : BASE DE DONNÉES MYSQL 8
# ---------------------------------------------------------------------
# A modifier en fonction des identifiants de votre serveur MySQL local.
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/cotisations_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
db.user=root
db.password=08111303

# ---------------------------------------------------------------------
# 2. PARAMÈTRES MÉTIER PAR DÉFAUT
# ---------------------------------------------------------------------
# Montant par défaut de la cotisation mensuelle (en FCFA)
app.cotisation.montant_mensuel_defaut=10000.00
# Montant de l'amende appliquée en cas de retard de paiement
app.amende.montant_retard_defaut=2500.00
# Libellé de la devise utilisée dans toute l'application
app.devise=FCFA

# ---------------------------------------------------------------------
# 3. POINT DE CONFIGURATION : SERVEUR SMTP (JAKARTA MAIL)
# ---------------------------------------------------------------------
# OPTION A : Mailtrap (recommandé pour les tests - gratuit sur mailtrap.io)
#   1. Créer un compte sur https://mailtrap.io
#   2. Aller dans "Email Testing" > "Inboxes" > votre inbox > "SMTP Settings"
#   3. Choisir "Jakarta Mail" dans la liste déroulante
#   4. Copier les valeurs host/port/username/password ci-dessous
#
# OPTION B : Gmail (production)
#   Activer l'authentification en 2 étapes sur votre compte Gmail puis
#   générer un "Mot de passe d'application" (Google Account > Sécurité > 2FA > App passwords)
#   mail.smtp.host=smtp.gmail.com
#   mail.smtp.port=587
#   mail.smtp.username=votre.email@gmail.com
#   mail.smtp.password=le_mot_de_passe_applicatif_16_caracteres
#   mail.from=votre.email@gmail.com
#
mail.smtp.host=sandbox.smtp.mailtrap.io
mail.smtp.port=2525
mail.smtp.auth=true
mail.smtp.starttls.enable=true
mail.smtp.username=c3112c0fa5b9d2
mail.smtp.password=cce3acc27b9ae2
mail.from=noreply@ucad.sn

