# =====================================================================
# SYSTEME DE GESTION DES COTISATIONS UCAD
# Fichier de Configuration Centralisé (application.properties)
# =====================================================================

# ---------------------------------------------------------------------
# 1. POINT DE CONFIGURATION : BASE DE DONNÉES MYSQL 8
# ---------------------------------------------------------------------
# A modifier en fonction des identifiants de votre serveur MySQL local.
db.driver=org.h2.Driver
db.url=jdbc:h2:mem:cotisations_db;DB_CLOSE_DELAY=-1;MODE=MySQL;INIT=RUNSCRIPT FROM 'classpath:sql/schema.sql'\\;RUNSCRIPT FROM 'classpath:sql/data.sql'
db.user=sa
db.password=

# ---------------------------------------------------------------------
# 2. PARAMÈTRES MÉTIER PAR DÉFAUT
# ---------------------------------------------------------------------
# Montant par défaut de la cotisation mensuelle (en FCFA)
app.cotisation.montant_mensuel_defaut=10000.00
# Montant de l'amende appliquée en cas de retard de paiement
app.amende.montant_retard_defaut=2500.00
# Libellé de la devise utilisée dans toute l'application
app.devise=FCFA

# ---------------------------------------------------------------------
# 3. POINT DE CONFIGURATION : SERVEUR SMTP (JAKARTA MAIL)
# ---------------------------------------------------------------------
# Paramètres du serveur d'envoi d'e-mails (Exemple avec Gmail SMTP ou Mailtrap).
mail.smtp.host=smtp.gmail.com
mail.smtp.port=587
mail.smtp.auth=true
mail.smtp.starttls.enable=true
mail.smtp.username=notifications@ucad.sn
mail.smtp.password=votre_mot_de_passe_app_ici
mail.from=notifications@ucad.sn
